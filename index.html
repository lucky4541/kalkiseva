    <!-- Google Translate Init and Banner Removal -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi,te,ta,kn,ml,bn',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          'google_translate_element'
        );
      }

      function removeGoogleTranslateBanner() {
        let attempts = 0;
        const maxAttempts = 30;
        const interval = setInterval(() => {
          const iframe = document.querySelector('iframe.goog-te-banner-frame');
          const banner = document.querySelector('.goog-te-banner-frame');
          const html = document.documentElement;
          const body = document.body;

          if (iframe || banner) {
            if (iframe) iframe.remove();
            if (banner) banner.remove();
            if (body) body.style.top = '0px';
            if (html) html.style.marginTop = '0px';
            console.log('✅ Removed Google Translate banner');
          }

          attempts++;
          if (attempts >= maxAttempts) {
            clearInterval(interval);
          }
        }, 300);
      }

      window.addEventListener('load', () => {
        removeGoogleTranslateBanner();
      });
    </script>

<script>
  // Permanent observer for translate elements
  function watchForTranslateElements() {
    const observer = new MutationObserver((mutations) => {
      // Remove banner frame
      const banner = document.querySelector('.goog-te-banner-frame');
      if (banner) banner.remove();
      
      // Remove any iframes
      document.querySelectorAll('iframe').forEach(iframe => {
        if (iframe.src.includes('translate.google')) iframe.remove();
      });
      
      // Reset body position
      document.body.style.top = '0';
      document.documentElement.style.marginTop = '0';
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true,
      attributes: false,
      characterData: false
    });
  }

  // Initialize when page loads
  window.addEventListener('load', () => {
    watchForTranslateElements();
    document.body.style.top = '0';
  });
</script>
